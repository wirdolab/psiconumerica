const $=id=>document.getElementById(id);let store;try{store=JSON.parse(localStorage.getItem('numa-v3'))||{}}catch{store={}};store.profile??={name:'',birth:'1998-09-08',goal:'crecimiento',demo:true};store.days??={};
store.profile.goals=Array.isArray(store.profile.goals)&&store.profile.goals.length?store.profile.goals:[store.profile.goal||"crecimiento"];let page=store.profile.demo?'me':'today';let persistedProfile=true;const now=new Date();const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=key(now);const reduce=n=>n?1+(n-1)%9:0;const digits=s=>String(s).replace(/\D/g,'').split('').reduce((a,b)=>a+Number(b),0);const master=n=>{while(n>9&&![11,22,33].includes(n))n=digits(n);return n};const parts=()=>store.profile.birth.split('-').map(Number);const cycleYear=()=>{let [y,m,d]=parts();let birthday=new Date(now.getFullYear(),m-1,d);if(m===2&&d===29&&birthday.getMonth()!==1)birthday=new Date(now.getFullYear(),1,28);return now<birthday?now.getFullYear()-1:now.getFullYear()};const annual=()=>{let [y,m,d]=parts();return reduce(digits(d)+digits(m)+digits(cycleYear()))};const monthly=()=>reduce(annual()+now.getMonth()+1);const num=()=>reduce(monthly()+now.getDate());const life=()=>master(digits(store.profile.birth));const nameNums=()=>{let letters=store.profile.name.toUpperCase().replace(/Ñ/g,'N').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z]/g,'');let a=0,b=0;for(let c of letters){let v=(c.charCodeAt(0)-65)%9+1;if('AEIOU'.includes(c))a+=v;else b+=v}return [master(a),master(b),master(a+b)]};const save=()=>{try{localStorage.setItem('numa-v3',JSON.stringify(store));return true}catch{return false}};const data=[null,['Iniciativa','El primer paso no necesita permiso.','Hoy es una invitación a iniciar, decidir y confiar en tu capacidad de abrir caminos.','Empieza una tarea pendiente durante cinco minutos.'],['Paciencia','No todo lo que crece hace ruido.','Escucha antes de actuar. La cooperación puede abrir puertas que la prisa no encuentra.','Escucha a alguien sin interrumpir.'],['Creatividad','Lo que llevas dentro merece salir.','Dale espacio a tu expresión y a las ideas que normalmente dejas para después.','Escribe tres ideas sin juzgarlas.'],['Disciplina','Los grandes cambios tienen pequeños cimientos.','Encuentra tranquilidad en el orden y en las acciones que puedes sostener.','Ordena un rincón durante cinco minutos.'],['Libertad','También puedes cambiar de dirección.','Explora una posibilidad diferente sin abandonar lo que te importa.','Cambia una pequeña parte de tu rutina.'],['Equilibrio','No tienes que resolverlo todo hoy.','Cuida tus vínculos sin olvidar tus propias necesidades.','Haz algo pequeño solamente para ti.'],['Introspección','El silencio también tiene respuestas.','Date permiso de observar, aprender y hacer preguntas antes de decidir.','Pasa cinco minutos sin pantallas.'],['Determinación','Tu esfuerzo merece una dirección.','Enfoca tus recursos en lo que realmente tiene valor para ti.','Define una prioridad concreta para hoy.'],['Generosidad','Soltar también es una forma de avanzar.','Reconoce lo aprendido y deja espacio para lo que viene.','Agradece algo que alguien hizo por ti.']];const goals={crecimiento:['Lee una página que te inspire.','Escribe una cosa que aprendiste hoy.'],trabajo:['Dedica cinco minutos a tu proyecto principal.','Anota el siguiente paso de tu objetivo profesional.'],relaciones:['Envía un mensaje sincero a alguien.','Reconoce un gesto amable que recibiste.'],bienestar:['Camina cinco minutos a tu ritmo.','Reserva un minuto para respirar con calma.'],finanzas:['Revisa un gasto reciente.','Anota una pequeña meta de ahorro.']};const labels={crecimiento:'Crecimiento personal',trabajo:'Trabajo y proyectos',relaciones:'Relaciones',bienestar:'Bienestar',finanzas:'Finanzas'};const selectedGoals=()=>store.profile.goals.filter(g=>goals[g]);
const dailyMissions=d=>{let g=selectedGoals();if(!g.length)g=["crecimiento"];let i=(now.getDate()-1)%g.length;return [d[3],goals[g[i]][0],Number.isInteger(entry().mood)?moods[entry().mood][2]:goals[g[(i+1)%g.length]][1]]};
const entry=()=>store.days[today]??={done:[],reflection:''};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const icons={today:'<path d="M3 10l9-7 9 7v11H3zM9 21v-7h6v7"/>',path:'<circle cx="12" cy="12" r="8"/><path d="M12 1v5m0 12v5M1 12h5m12 0h5"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 22v-2a8 8 0 0116 0v2"/>'};const palette=[null,['#923e3b','#fce6e2','#efb6b0'],['#355f91','#e6effc','#b8d4f6'],['#805719','#fff3d2','#f8d786'],['#426b43','#e8f0e2','#b9d6aa'],['#9b4d29','#ffeadc','#ffc49c'],['#69449e','#f0e5fc','#d6b8f4'],['#4c4b93','#e8e9fc','#bfc3f5'],['#796024','#f4edda','#e5cc8e'],['#96436c','#fbe5ef','#efb7d3']];

const moods=[['rain','Triste','Haz una pausa breve y date permiso de ir despacio.'],['wind','Inquieto','Anota una preocupación y una acción pequeña que esté en tus manos.'],['neutral','Neutral','Observa algo nuevo en tu entorno durante un minuto.'],['calm','En calma','Reserva dos minutos para disfrutar el silencio.'],['sun','Motivado','Dedica cinco minutos extra a tu prioridad.']];

const extraQuotes=[null,'No necesitas ver todo el camino para dar el primer paso.','Escuchar también es una forma de avanzar.','Haz espacio para lo que todavía no existe.','Lo pequeño que sostienes se convierte en raíz.','Cambiar de rumbo también es crecer.','Cuidarte es parte de cuidar el mundo.','Hay claridad en las preguntas que no apresuras.','Pon tu esfuerzo donde tenga sentido.','Deja espacio para lo que está por llegar.'];
function moodSet(i){const e=entry();if(e.mood===i)return;if(e.done.length&& !confirm('Cambiar tu estado ajustará la tercera misión. ¿Continuar?'))return;e.mood=i;e.done=e.done.filter(x=>x!==2);save();render()}
function moodCard(e){return `<section class="card"><div class="eyebrow">Tu clima emocional · opcional</div><div class="section-title" style="margin-top:7px">¿Cómo amaneció tu mundo interior?</div><div class="moods">${moods.map(([k,l],i)=>`<button aria-pressed="${e.mood===i}" onclick="moodSet(${i})">${icon(k)}${l}</button>`).join('')}</div>${Number.isInteger(e.mood)?'<p>Adaptamos tu tercera misión a cómo te sientes.</p>':''}</section>`}

function showNumber(label,v){const d=data[reduce(v)];const box=document.createElement('dialog');box.innerHTML=`<div class="eyebrow">${label}</div><h1>${v} · ${d?d[0]:'Por explorar'}</h1><p>${d?d[2]:'Completa tu nombre para calcular este número.'}</p><button class="primary">Cerrar</button>`;document.body.append(box);box.querySelector('button').onclick=()=>{box.close();box.remove()};box.showModal()}

function downloadStory(){const c=document.createElement('canvas');c.width=1080;c.height=1920;const x=c.getContext('2d'),p=palette[num()],d=reading();x.fillStyle=p[1];x.fillRect(0,0,1080,1920);x.fillStyle=p[0];x.textAlign='center';x.font='42px sans-serif';x.fillText('psiconumérica.',540,160);x.strokeStyle=p[0];x.lineWidth=2;x.beginPath();x.ellipse(540,550,270,160,-.4,0,Math.PI*2);x.stroke();x.beginPath();x.ellipse(540,550,270,160,.4,0,Math.PI*2);x.stroke();x.font='250px Georgia';x.fillText(String(num()),540,635);x.font='76px Georgia';let lines=[],line='';for(const w of d[1].split(' ')){if(x.measureText(line+' '+w).width>850&&line){lines.push(line);line=w}else line+=(line?' ':'')+w}lines.push(line);lines.forEach((l,i)=>x.fillText(l,540,950+i*100));x.font='32px sans-serif';x.fillText('Cada día, una oportunidad de ser tú.',540,1770);c.toBlob(b=>{if(!b)return;const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='psiconumerica-'+today+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')}
function reading(){const d=[...data[num()]];if(Math.floor(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())/86400000/9)%2)d[1]=extraQuotes[num()];return d}
function go(p){page=p;render();window.scrollTo(0,0)}function render(){const n=num(),d=reading(),e=entry(),total=Object.values(store.days).filter(x=>x.done.length===3).length;const pal=palette[n];for(const [i,k] of ['--accent','--wash','--glow'].entries())document.querySelector('.app').style.setProperty(k,pal[i]);$('count').innerHTML=icon('star')+` ${total} ${total===1?'estrella':'estrellas'}`;$('nav').innerHTML=[['today','Hoy'],['path','Mi camino'],['me','Mi universo']].map(([k,l])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${icons[k]}</svg>${l}</button>`).join('');let html='';if(page==='welcome'){html=`<section class="hero"><div class="orbit"><div class="orb">${icon('check')}</div></div><div class="eyebrow">${persistedProfile?'Perfil guardado':'Perfil creado para esta sesión'}</div><h1>¡Todo listo, ${esc(store.profile.name.split(' ')[0])}!</h1><p>Tu universo numerológico está listo. Tu número de hoy es ${n}.</p><section class="card"><div class="eyebrow">Tu energía de hoy</div><h1>${d[0]}</h1><p>${d[1]}</p></section><button class="primary" type="button" onclick="go('today')">Descubrir mi día</button>${persistedProfile?'':'<p>No se pudo guardar en este navegador. Puedes continuar durante esta sesión.</p>'}</section>`}else if(page==='today'&&store.profile.demo){html=`<section class="hero"><h1>Tu día comienza contigo.</h1><p>Crea tu perfil para descubrir tu lectura personal.</p><button class="primary" onclick="go('me')">Crear mi perfil</button></section>`}else if(page==='today'){html=`<section class="hero"><div class="eyebrow">${now.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}</div><div class="orbit"><div class="orb">${n}</div><span class="spark">${icon('star')}</span><span class="spark b">${icon('star')}</span></div><div class="eyebrow">Tu número personal de hoy</div><h1>${d[1]}</h1><p>${d[2]}</p>${store.profile.demo?'<button class="quiet" onclick="go(\'me\')">Modo ejemplo · Personaliza tu fecha</button>':''}</section><section class="card skill"><div class="symbol">${icon('star')}</div><div><div class="eyebrow">Tu habilidad de hoy</div><div style="font-size:17px;margin-top:4px">${d[0]}</div></div></section>${guideCard(n)}${moodCard(e)}<section class="card"><div class="row"><div><div class="section-title">Tus 3 misiones</div><div class="small">Pequeños pasos, grandes cambios.</div></div><span class="small">${e.done.length}/3</span></div><div class="bar"><i style="width:${e.done.length/3*100}%"></i></div>${dailyMissions(d).map((m,i)=>`<label class="mission"><input type="checkbox" ${e.done.includes(i)?'checked':''} onchange="toggle(${i},this.checked)"><span>${m}</span></label>`).join('')}${e.done.length===3?`<div class="notice">${icon('star')} Una estrella más en tu camino.</div>`:''}</section><div class="quoteactions"><button class="quiet" onclick="shareQuote()">${icon('share')} Compartir frase</button><button class="quiet" onclick="downloadStory()">Guardar story</button></div><section class="card night"><div class="section-title">${icon('moon')} Antes de dormir</div><p>¿Qué pequeño paso te hizo sentir bien hoy?</p><textarea rows="2" placeholder="Un momento para ti…" oninput="entry().reflection=this.value;save()">${esc(e.reflection)}</textarea></section><div class="footer">Una guía simbólica, no una predicción.</div>`}else if(page==='path'){const start=new Date(now.getFullYear(),now.getMonth(),1),days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();html=`<h1 class="viewtitle">Mi constelación</h1><p>Cada estrella representa un día en el que cumpliste contigo.</p><section class="card sky"><div class="row"><div class="section-title" style="text-transform:capitalize">${now.toLocaleDateString('es-MX',{month:'long',year:'numeric'})}</div><span class="small">${total} estrellas en total</span></div>${skyArt()}<div class="stats"><div><strong>${total}</strong><span class="small">Días completos</span></div><div><strong>${Object.values(store.days).reduce((a,v)=>a+v.done.length,0)}</strong><span class="small">Misiones</span></div></div><div class="stars">${['L','M','M','J','V','S','D'].map(x=>`<span class="small">${x}</span>`).join('')}${'<span></span>'.repeat((start.getDay()+6)%7)}${Array.from({length:days},(_,i)=>{let k=key(new Date(now.getFullYear(),now.getMonth(),i+1)),lit=store.days[k]?.done.length===3;return `<div class="day ${lit?'lit':''} ${k===today?'today':''}" aria-label="Día ${i+1}${lit?', completado':''}">${lit?icon('star'):i+1}</div>`}).join('')}</div></section><section class="card"><div class="section-title">Mis reflexiones</div>${Object.entries(store.days).filter(([k,v])=>v.reflection).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,10).map(([k,v])=>`<p class="small">${k}</p><p>${esc(v.reflection)}</p>`).join('')||'<p>Tus reflexiones aparecerán aquí.</p>'}</section><section class="card"><div class="eyebrow">Tu intención</div><h1 style="font-size:25px">${selectedGoals().map(g=>labels[g]).join(" · ")}</h1><p>No necesitas una racha perfecta para avanzar.</p><button class="quiet" onclick="go('me')">Cambiar objetivo</button></section>`}else{html=`<h1 class="viewtitle">Tu universo</h1><p>Crea tu perfil con tu nombre completo de nacimiento, fecha de nacimiento y los objetivos que deseas cultivar.</p><section class="card"><form id="profileForm" novalidate><label class="field">Nombre completo de nacimiento<input name="name" required maxlength="120" value="${esc(store.profile.name)}" placeholder="Nombre(s) y apellidos"></label><label class="field">Fecha de nacimiento<input name="birth" type="date" required min="1900-01-01" max="${today}" value="${store.profile.demo?'':store.profile.birth}"></label><fieldset class="goalset"><legend>Mis objetivos</legend><p class="small">Selecciona todos los que quieras. Tus misiones alternarán entre ellos.</p><div class="goalchips">${Object.entries(labels).map(([k,l])=>`<label class="chip"><input type="checkbox" name="goal" value="${k}" ${store.profile.goals.includes(k)?'checked':''}><span>${l}</span></label>`).join('')}</div></fieldset><p id="formError" role="alert" class="small"></p><button type="submit" class="primary">${store.profile.demo?'Crear mi perfil':'Guardar cambios'}</button></form></section>${!store.profile.demo?`<section class="card"><div class="eyebrow">Tu camino de vida</div><h1>${life()} · ${data[reduce(life())][0]}</h1><p>${data[reduce(life())][2]}</p></section><section class="card"><div class="eyebrow">Tu mapa numerológico</div><div class="profilegrid">${[['Alma',nameNums()[0]],['Personalidad',nameNums()[1]],['Destino',nameNums()[2]],['Regalo',master(digits(parts()[0]%100))],['Ciclo anual',annual()],['Mes personal',monthly()],['Día personal',num()],['Actitud',reduce(parts()[1]+parts()[2])]].map(([l,v])=>`<button class="mapnode" onclick="showNumber('${l}',${v})"><strong>${v}</strong><span>${l}</span></button>`).join('')}</div><details><summary>Cómo se calcula tu día</summary><p>Ciclo anual: día y mes de nacimiento más el año de tu último cumpleaños (${cycleYear()}). Mes personal: ciclo anual más mes calendario. Día personal: mes personal más día calendario. Fórmula diaria provisional, pendiente de validación con Claudio.</p></details></section>`:''}<p class="small">Tus datos se guardan únicamente en el almacenamiento local de este navegador. Inspirado en Numerología Integral de Claudio Preciado Cueva. Fórmula diaria y textos provisionales, pendientes de validación. Los números maestros 11, 22 y 33 se conservan provisionalmente en los cálculos del perfil.</p><button class="quiet" onclick="resetAll()">Borrar mis datos</button>`}$('view').innerHTML=`<div class="fade">${html}</div>`; const form=$('profileForm'); if(form){form.addEventListener('submit',saveProfile);form.querySelector('button[type=submit]').addEventListener('click',ev=>{ev.preventDefault();saveProfile({preventDefault(){},currentTarget:form});});} if(page==='today'||page==='me')$('view').insertAdjacentHTML('beforeend',`<section class="card consult"><div class="eyebrow">Un espacio para ti</div><div class="section-title">Asesoría psiconumerológica 1:1</div><p>Explora tu mapa personal con acompañamiento individual.</p><button class="primary" onclick="consult()">Solicitar asesoría</button></section>`);}function toggle(i,v){let e=entry();e.done=v?[...new Set([...e.done,i])]:e.done.filter(x=>x!==i);save();render()}function saveProfile(ev){ev.preventDefault();const f=new FormData(ev.currentTarget),birth=f.get('birth'),name=String(f.get('name')||'').trim(),chosen=f.getAll('goal').filter(g=>goals[g]);if(!birth||birth<'1900-01-01'||birth>today||!name||!chosen.length){$('formError').textContent='Completa tus datos y selecciona al menos un objetivo.';return;}const first=store.profile.demo;const changed=store.profile.birth!==birth||JSON.stringify(store.profile.goals)!==JSON.stringify(chosen)||store.profile.demo;if(changed)store.days[today]={done:[],reflection:entry().reflection};store.profile={name,birth,goals:chosen,goal:chosen[0],demo:false};persistedProfile=save();go('welcome');}function consult(){const box=document.createElement('dialog');box.innerHTML='<h2>Asesoría 1:1</h2><p>Próximamente podrás reservar una sesión con un psiconumerólogo. El enlace de citas aún no está configurado.</p><button class="primary">Entendido</button>';document.body.append(box);box.querySelector('button').onclick=()=>{box.close();box.remove()};box.showModal();}function resetAll(){if(confirm('¿Borrar tu perfil y progreso de este navegador?')){try{localStorage.removeItem('numa-v3')}catch{};store={profile:{name:'',birth:'1998-09-08',goals:['crecimiento'],demo:true},days:{}};go('me')}}async function shareQuote(){let text=reading()[1]+' — Psiconumérica';try{if(navigator.share)await navigator.share({text});else{await navigator.clipboard.writeText(text);alert('Frase copiada.')}}catch{prompt('Copia tu frase:',text)}}render();</script></body></html>
